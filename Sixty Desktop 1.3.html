:root {
  --color-bg: #fdf5f1;
  --color-surface: #ffffff;
  --color-text: #1c1268;
  --color-accent: #1c1268;
  --color-accent-100: #ecebf7;
  --color-accent-200: #d5d2ec;
  --color-accent-300: #a9a3d6;
  --color-accent-400: #7369b8;
  --color-accent-500: #372c93;
  --color-accent-600: #281d75;
  --color-accent-700: #1c1268;
  --color-accent-800: #150d4f;
  --color-accent-900: #0d0733;
  --color-accent-2: #d08b7d;
  --color-success: #1b5e3a;
  --color-accent-2-100: #fdf1ee;
  --color-accent-2-200: #f8ded8;
  --color-accent-2-300: #f0c8bf;
  --color-accent-2-400: #e3aa9e;
  --color-accent-2-500: #d08b7d;
  --color-accent-2-600: #b8705f;
  --color-accent-2-700: #94564a;
  --color-accent-2-800: #6e3f36;
  --color-accent-2-900: #472823;
  --color-neutral-100: #f6f3f0;
  --color-neutral-200: #ece8e4;
  --color-neutral-300: #ece8e4;
  --color-neutral-400: #c4bdb7;
  --color-neutral-500: #9a938d;
  --color-neutral-600: #766f6a;
  --color-neutral-700: #57514d;
  --color-neutral-800: #3b3633;
  --color-neutral-900: #232120;
  --shadow-sm: 0 1px 2px rgba(28,18,104,.06), 0 4px 14px rgba(28,18,104,.05);
  --shadow-md: 0 2px 6px rgba(28,18,104,.07), 0 10px 26px rgba(28,18,104,.07);
  --shadow-lg: 0 6px 18px rgba(28,18,104,.10), 0 22px 50px rgba(28,18,104,.12);
  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-body); font-size: 15px;
}
button { font: inherit; border: none; background: none; }
@keyframes sxFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sxRise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none; font-family: var(--font-heading);
  font-size: 13.5px; line-height: 1.2; padding: 10px 16px; border-radius: 999px;
  border: 1px solid transparent;
}
.btn-secondary { border-color: var(--color-accent-200); color: var(--color-text); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.btn-primary { background: var(--color-accent); color: #fdf5f1; padding: 10px 18px; }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-home { background: var(--color-accent-2-200); color: var(--color-accent-2-800); padding: 10px 18px; }
.btn-home:hover { background: var(--color-accent-2-300); }

.lang-toggle {
  display: flex; border: 1px solid var(--color-accent-200); border-radius: 999px;
  overflow: hidden; flex: none;
}
.lang-toggle button {
  all: unset; cursor: pointer; padding: 10px 12px; font-family: var(--font-heading);
  font-size: 12px; color: var(--color-text); opacity: .5;
}
.lang-toggle button.active { background: var(--color-accent-100); opacity: 1; color: var(--color-accent-700); }
.lang-toggle button:hover { opacity: .85; }

.dx-cell {
  cursor: pointer; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
  transition: box-shadow .13s ease, transform .13s ease;
}
.dx-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dx-press { cursor: pointer; user-select: none; }
.dx-scroll::-webkit-scrollbar { width: 9px; }
.dx-scroll::-webkit-scrollbar-thumb { background: #d5d2ec; border-radius: 999px; }

/* Start-up splash: icon, name and tagline centred on the screen. */
#splash {
  position: fixed; inset: 0; z-index: 1000; background: var(--color-accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .5s ease;

function loadState() {
  let s;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) {}
  if (!s) {
    s = { days: {}, worktime: 100, target: 60, lang: 'sv', sheet: null };
  }
  // Always open on the current month — a saved viewY/viewM is just where the
  // user last browsed to, not something that should outlive a new day.
  const todayNow = new Date();
  s.viewY = todayNow.getFullYear();
  s.viewM = todayNow.getMonth();
  if (s.worktime == null) s.worktime = 100;
  if (TARGET_OPTIONS.indexOf(s.target) === -1) s.target = 60;
  if (s.lang !== 'en' && s.lang !== 'sv') s.lang = 'sv';
  if (!s.reminder || typeof s.reminder !== 'object') s.reminder = {};
  s.reminder.frequency = 'weekdays';
  if (typeof s.reminder.hour !== 'number' || s.reminder.hour < 8 || s.reminder.hour > 18) s.reminder.hour = 17;
  s.reminder.enabled = !!s.reminder.enabled;
  if (!s.reminder.enabled && !s.reminder.hourCustom) s.reminder.hour = 17;
  if (!s.celebratedMonths) s.celebratedMonths = [];
  if (!s.celebratedMilestones) s.celebratedMilestones = [];
  if (!s.seededHolidays) s.seededHolidays = [];
  const seeded = new Set(s.seededHolidays);
  for (const d in HOLIDAYS) {
    if (!(d in s.days) && !seeded.has(d)) {
      s.days[d] = 'holiday';
      seeded.add(d);
    }
  }
  s.seededHolidays = Array.from(seeded);
  return s;
}

function officeStreakEndingAt(iso_) {
  let [y, m, d] = iso_.split('-').map(Number);
  m -= 1;
  let count = 0;
  for (let guard = 0; guard < 3660; guard++) {
    if (WORKDAYS.indexOf(dow(y, m, d)) !== -1) {
      const t = state.days[iso(y, m, d)];
      if (t === 'office' || t === 'travel') count++;
      else break;
    }
    const dt = new Date(y, m, d - 1);
    y = dt.getFullYear(); m = dt.getMonth(); d = dt.getDate();
  }
  return count;
}

function setDay(iso_, type) {
  const days = Object.assign({}, state.days);
  if (type === null) delete days[iso_]; else days[iso_] = type;
  setState({ days, sheet: null });
  if (type === 'office' || type === 'travel') {
    const streak = officeStreakEndingAt(iso_);
    if (streak > 0 && streak % 2 === 0) playStreakChime();
  }
}

function playTone(ctx, freq, startTime, duration, type, gainPeak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

}
function playStreakChime() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;

  playTone(ctx, 988, now + 0.1, 0.18, 'sine', 0.22);
}
function playMilestoneChime() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  playTone(ctx, 523.25, now, 0.11, 'triangle', 0.18); // C5
  playTone(ctx, 659.25, now + 0.09, 0.11, 'triangle', 0.18); // E5

}

// Reminders are one-off notifications for each upcoming working day (not
// repeating weekly ones), so a day that is already logged — or is a holiday,
// leave or sick day — simply gets no notification. The schedule is rebuilt
// whenever the data changes and when the app opens or returns to the front.
const LEGACY_REMINDER_IDS = [301, 302, 303, 304, 305, 306]; // repeating weekly reminders from 1.0-1.2
const REMINDER_ID_BASE = 1000;
const REMINDER_COUNT = 60; // iOS keeps at most 64 pending local notifications

function reminderDates() {
  const out = [];
  const now = new Date();
  for (let i = 0; out.length < REMINDER_COUNT && i < 150; i++) {
    const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, state.reminder.hour, 0, 0);
    if (at <= now) continue;
    if (WORKDAYS.indexOf(at.getDay()) === -1) continue;
    const t = state.days[iso(at.getFullYear(), at.getMonth(), at.getDate())];
    if (t && t !== 'planned') continue; // logged, holiday, leave or sick — nothing to remind about
    out.push(at);
  }
  return out;
}

async function cancelReminders() {
  if (!isNativeApp() || !window.CapLocalNotifications) return;
  const N = window.CapLocalNotifications;
  let ids = LEGACY_REMINDER_IDS.slice();
  try {
    const pending = await N.getPending();
    (pending.notifications || []).forEach(n => { if (n.id >= REMINDER_ID_BASE) ids.push(n.id); });
  } catch (e) {
    for (let i = 0; i < REMINDER_COUNT + 4; i++) ids.push(REMINDER_ID_BASE + i);
  }
  try { await N.cancel({ notifications: ids.map(id => ({ id })) }); } catch (e) {}
}

let lastReminderSig = null, reminderTimer = null, reminderChain = Promise.resolve();

function queueReminderSync(force) {
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(() => {
    reminderChain = reminderChain.then(() => syncReminders(force)).catch(() => {});
  }, 300);
}

async function syncReminders(force) {
  if (!isNativeApp() || !window.CapLocalNotifications || !state.reminder.enabled) return false;
  const N = window.CapLocalNotifications;
  const dates = reminderDates();
  const sig = state.reminder.hour + '|' + state.lang + '|' + dates.map(d => d.getTime()).join(',');
  const t = state.days[todayIso()];
  if (t && t !== 'planned') { try { await N.removeAllDeliveredNotifications(); } catch (e) {} } // today is logged: clear a reminder already on the lock screen
  if (!force && sig === lastReminderSig) return true;
  try {
    const perm = await N.checkPermissions();
    if (perm.display !== 'granted') return false;
    await cancelReminders();
    if (dates.length) {
      await N.schedule({ notifications: dates.map((at, i) => ({
        id: REMINDER_ID_BASE + i, title: STR.reminderNotifTitle, body: STR.reminderNotifBody,
        schedule: { at, allowWhileIdle: true },
      })) });
    }
    lastReminderSig = sig;
    return true;
  } catch (e) { return false; }
}

async function scheduleReminders() {
  if (!isNativeApp() || !window.CapLocalNotifications) {
    ioMsg = STR.reminderWebOnly;
    render();
    return false;
  }
  try {
    const perm = await window.CapLocalNotifications.requestPermissions();
    if (perm.display !== 'granted') {
      ioMsg = STR.reminderPermMsg;
      render();
      return false;
    }
  } catch (e) {
    ioMsg = STR.reminderPermMsg;
    render();
    return false;
  }
  return true;
}

async function enableReminder() {
  const ok = await scheduleReminders(); // asks for notification permission
  if (!ok) return;
  state.reminder = Object.assign({}, state.reminder, { enabled: true });
  await syncReminders(true);
  ioMsg = STR.reminderOnMsg;
  saveState();

}

async function exportData() {
  const payload = {
    days: state.days, viewY: state.viewY, viewM: state.viewM,
    worktime: state.worktime, target: state.target, lang: state.lang, seededHolidays: state.seededHolidays,
    celebratedMonths: state.celebratedMonths, celebratedMilestones: state.celebratedMilestones,
  };
  const json = JSON.stringify(payload, null, 2);
  const filename = 'sixty-data-' + todayIso() + '.json';

  if (isNativeApp()) {
    // Native iOS: write to the app's cache dir, then hand it to the system share sheet
    // (AirDrop, Files, Mail, etc.) instead of a browser-style <a download> link,
    // which is unreliable inside a WKWebView.
    try {
      await window.CapFilesystem.writeFile({
        path: filename,
        data: json,
        directory: window.CapDirectory.Cache,
        encoding: window.CapEncoding.UTF8,
      });
      const { uri } = await window.CapFilesystem.getUri({ path: filename, directory: window.CapDirectory.Cache });
      await window.CapShare.share({ title: filename, url: uri, dialogTitle: STR.exportLabel });
    } catch (e) {
      ioMsg = STR.importErr;
      render();
    }
    return;
  }

  // Browser fallback, used when testing this file directly in a desktop/mobile browser.
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

      state.target = TARGET_OPTIONS.indexOf(data.target) !== -1 ? data.target : 60;
      state.lang = (data.lang === 'en' || data.lang === 'sv') ? data.lang : state.lang;
      state.seededHolidays = Array.isArray(data.seededHolidays) ? data.seededHolidays : [];
      state.celebratedMonths = Array.isArray(data.celebratedMonths) ? data.celebratedMonths : [];
      state.celebratedMilestones = Array.isArray(data.celebratedMilestones) ? data.celebratedMilestones : [];
      saveState();
      queueReminderSync();
      ioMsg = STR.importOk;
    } catch (e) {
      ioMsg = STR.importErr;
    }
    render();
  };
  reader.onerror = () => { ioMsg = STR.importErr; render(); };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm(STR.clearConfirm)) return;
  const now = new Date();
  state.days = {};
  const seeded = new Set();
  for (const d in HOLIDAYS) { state.days[d] = 'holiday'; seeded.add(d); }
  state.seededHolidays = Array.from(seeded);
  state.celebratedMonths = [];
  state.celebratedMilestones = [];
  state.worktime = 100;
  state.target = 60;
  state.viewY = now.getFullYear();
  state.viewM = now.getMonth();
  state.sheet = null;
  saveState();
  queueReminderSync();
  ioMsg = STR.clearOk;
  render();
}

function stats(y, m) {
  const s = state, d = dim(y, m);
  let working = 0, office = 0, travel = 0, home = 0, out = 0, ahead = 0, planned = 0, plannedAhead = 0;
  for (let dd = 1; dd <= d; dd++) {
    if (WORKDAYS.indexOf(dow(y, m, dd)) === -1) continue;
    working++;
    const t = s.days[iso(y, m, dd)];
    if (t === 'office') office++;
    else if (t === 'travel') travel++;
    else if (t === 'home') home++;
    else if (EXCLUDED.indexOf(t) !== -1) out++;
    else if (t === 'planned') { planned++; if (iso(y, m, dd) >= TODAY) { ahead++; plannedAhead++; } }
    else if (iso(y, m, dd) >= TODAY) ahead++;
  }
  const inOffice = office + travel;
  const eligibleFull = Math.max(1, working - out);
  const scale = s.worktime / 100;
  const eligible = Math.max(1, Math.round(eligibleFull * scale));
  const aheadScaled = Math.round(ahead * scale);
  const required = Math.floor(eligible * s.target / 100);
  return {
    working, inOffice, planned, plannedAhead, home, out, ahead: aheadScaled, eligible, eligibleFull, required,
    pct: Math.round(inOffice / eligible * 100),
    deficit: Math.max(0, required - inOffice),
    leftWithPlanned: Math.max(0, required - inOffice - plannedAhead),
    projPct: Math.round(Math.min(inOffice + aheadScaled, eligible) / eligible * 100),
  };
}

function look(t) {
  switch (t) {
    case 'office': return { bg: 'var(--color-accent)', fg: '#fdf5f1', border: '1px solid transparent', label: STR.types.office, glyph: 'O' };
    case 'planned': return { bg: 'var(--color-success)', fg: '#fdf5f1', border: '1px solid transparent', label: STR.types.planned, glyph: STR.badges.planned };
    case 'travel': return { bg: 'var(--color-accent-600)', fg: '#fdf5f1', border: '1px solid transparent', label: STR.types.travel, glyph: STR.badges.travel };
    case 'home': return { bg: 'var(--color-accent-2-200)', fg: 'var(--color-accent-2-800)', border: '1px solid transparent', label: STR.types.home, glyph: 'H' };
    case 'leave': return { bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-700)', border: '1px solid transparent', label: STR.types.leave, glyph: STR.badges.leave };
    case 'sick': return { bg: 'var(--color-neutral-100)', fg: 'var(--color-neutral-700)', border: '1.5px dashed var(--color-neutral-400)', label: STR.types.sick, glyph: STR.badges.sick };
    case 'holiday': return { bg: 'var(--color-accent-2-100)', fg: 'var(--color-accent-2-700)', border: '1px solid transparent', label: STR.types.holiday, glyph: STR.badges.holiday };
    default: return { bg: 'var(--color-surface)', fg: 'var(--color-accent-700)', border: '1.5px dashed var(--color-accent-200)', label: '', glyph: '×' };
  }
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'style') e.style.cssText = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) e.appendChild(c); });
  return e;
}

      el('div', { class: 'legal-bar' }, [el('div', { class: 'legal-back dx-press', onclick: () => setState({ privacyOpen: false }) }, [svgChevronLeft(), el('span', { text: STR.back })])]),
      el('div', { class: 'legal-body' }, body),
    ]));
  }

  // ---------- Reminder sheet ----------
  if (false) { // reminder sheet: phone only
    const hour = s.reminder.hour;

    const overlay = el('div', { class: 'sheet-overlay' });
    overlay.appendChild(el('div', { class: 'sheet-backdrop', onclick: () => setState({ reminderSheetOpen: false }) }));
    const sheet = el('div', { class: 'sheet' });
    sheet.appendChild(el('div', { class: 'sheet-head' }, [
      el('div', { style: 'flex:1' }, [
        el('div', { class: 'sheet-title', text: STR.reminderTitle }),
        el('div', { class: 'sheet-sub', text: STR.reminderSub }),
      ]),
      el('div', { class: 'sheet-close dx-press', onclick: () => setState({ reminderSheetOpen: false }) }, [svgClose()]),
    ]));

    sheet.appendChild(el('div', { class: 'section-title', style: 'margin-bottom:6px', text: STR.reminderFreqLabel }));
    sheet.appendChild(el('div', { class: 'reminder-freq-static', text: STR.reminderFreqWeekdays }));

    const timeRow = el('div', { class: 'target-row' });
    timeRow.appendChild(el('div', { class: 'target-copy', text: STR.reminderTimeLabel }));
    timeRow.appendChild(el('div', { class: 'stepper dx-press', onclick: () => setState(p => ({ reminder: Object.assign({}, p.reminder, { hour: Math.max(8, p.reminder.hour - 1), hourCustom: true }) })) }, [svgMinus()]));
    timeRow.appendChild(el('div', { class: 'target-val', text: hh(hour) }));
    timeRow.appendChild(el('div', { class: 'stepper dx-press', onclick: () => setState(p => ({ reminder: Object.assign({}, p.reminder, { hour: Math.min(18, p.reminder.hour + 1), hourCustom: true }) })) }, [svgPlus()]));
    sheet.appendChild(timeRow);

    sheet.appendChild(s.reminder.enabled
      ? el('button', { class: 'btn btn-secondary dx-press', style: 'align-self:stretch;justify-content:center;margin-top:18px', text: STR.reminderDisable, onclick: disableReminder })
      : el('button', { class: 'btn btn-primary dx-press', style: 'align-self:stretch;justify-content:center;margin-top:18px', text: STR.reminderEnable, onclick: enableReminder }));

    overlay.appendChild(sheet);
    app.appendChild(overlay);
  }
}

function isoWeek(y, m, d) {
  const dt = new Date(Date.UTC(y, m, d));
  dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
  return Math.ceil(((dt - Date.UTC(dt.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
}

function brandName() {
  return el('div', { class: 'brand-name' }, [document.createTextNode('Sixty'), el('span', { class: 'brand-pct', text: '%' })]);
}

function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

function svgMinus() {
  const s = svgBase();
  s.innerHTML = '<path d="M5 12h14"></path>';
  return s;
}

  const s = svgBase();

  const s = svgBase(size || 15);
  s.innerHTML = '<path d="M9 3h6M12 3v2"></path><circle cx="12" cy="13" r="8"></circle><path d="M12 13V9M12 13l3 2"></path>';
  return s;
}
function svgBase(size) {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', size || 13);
  s.setAttribute('height', size || 13);
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2.75');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  return s;
}

function launchFireworks() {
  const old = document.getElementById('fireworks-canvas');
  if (old) old.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'fireworks-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#1c1268', '#7369b8', '#d08b7d', '#f0c8bf', '#fdf5f1', '#372c93'];
  const gravity = 0.045;
  const friction = 0.985;
  let particles = [];

  function burst(x, y) {
    const count = 46;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const speed = 2.4 + Math.random() * 3.4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: colors[(Math.random() * colors.length) | 0],
        life: 1,
        decay: 0.007 + Math.random() * 0.011,
        size: 2 + Math.random() * 2.2,
      });
    }
  }

  const bursts = [
    [0.28, 0.32], [0.72, 0.26], [0.5, 0.42], [0.62, 0.55], [0.38, 0.5],
  ];
  bursts.forEach(([fx, fy], i) => {
    setTimeout(() => { burst(canvas.width * fx, canvas.height * fy); triggerHaptic('Heavy'); playFireworksPop(); }, i * 450);
  });

  const start = performance.now();
  const duration = bursts.length * 450 + 2200;

  function frame(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.vy += gravity;
      p.vx *= friction;
      p.vy *= friction;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (now - start < duration || particles.length) {
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

render();

// Rebuild the reminder schedule on launch (also migrates 1.0-1.2 users off the
// old repeating reminders) and whenever the app comes back to the foreground.
if (state.reminder.enabled) queueReminderSync(true);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.reminder.enabled) queueReminderSync();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.sheet || state.privacyOpen) setState({ sheet: null, privacyOpen: false });
    return;
  }
  if (state.sheet || state.privacyOpen) return;
  if (e.key === 'ArrowLeft') setState(p => p.viewM === 0 ? { viewM: 11, viewY: p.viewY - 1 } : { viewM: p.viewM - 1 });
  if (e.key === 'ArrowRight') setState(p => p.viewM === 11 ? { viewM: 0, viewY: p.viewY + 1 } : { viewM: p.viewM + 1 });
});
