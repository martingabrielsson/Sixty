<style>
:root {
  --color-bg: #fdf5f1;
  --color-surface: #ffffff;
  --color-text: #1c1268;
  --color-accent: #1c1268;
  --color-accent-100: #ecebf7;
  --color-accent-200: #d5d2ec;
  --color-accent-300: #a9a3d6;
  --color-accent-400: #7369b8;
  --color-accent-500: #372c93;
  --color-accent-600: #281d75;
  --color-accent-700: #1c1268;
  --color-accent-800: #150d4f;
  --color-accent-900: #0d0733;
  --color-accent-2: #d08b7d;
  --color-success: #1b5e3a;
  --color-accent-2-100: #fdf1ee;
  --color-accent-2-200: #f8ded8;
  --color-accent-2-300: #f0c8bf;
  --color-accent-2-400: #e3aa9e;
  --color-accent-2-500: #d08b7d;
  --color-accent-2-600: #b8705f;
  --color-accent-2-700: #94564a;
  --color-accent-2-800: #6e3f36;
  --color-accent-2-900: #472823;
  --color-neutral-100: #f6f3f0;
  --color-neutral-200: #ece8e4;
  --color-neutral-300: #ece8e4;
  --color-neutral-400: #c4bdb7;
  --color-neutral-500: #9a938d;
  --color-neutral-600: #766f6a;
  --color-neutral-700: #57514d;
  --color-neutral-800: #3b3633;
  --color-neutral-900: #232120;
  --shadow-sm: 0 1px 2px rgba(28,18,104,.06), 0 4px 14px rgba(28,18,104,.05);
  --shadow-md: 0 2px 6px rgba(28,18,104,.07), 0 10px 26px rgba(28,18,104,.07);
  --shadow-lg: 0 6px 18px rgba(28,18,104,.10), 0 22px 50px rgba(28,18,104,.12);
  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-body); font-size: 15px;
}
button { font: inherit; border: none; background: none; }
@keyframes sxFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sxRise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none; font-family: var(--font-heading);
  font-size: 13.5px; line-height: 1.2; padding: 10px 16px; border-radius: 999px;
  border: 1px solid transparent;
}
.btn-secondary { border-color: var(--color-accent-200); color: var(--color-text); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.btn-primary { background: var(--color-accent); color: #fdf5f1; padding: 10px 18px; }
.btn-primary:hover { background: var(--color-accent-600); }

.lang-toggle {
  display: flex; border: 1px solid var(--color-accent-200); border-radius: 999px;
  overflow: hidden; flex: none;
}
.lang-toggle button {
  all: unset; cursor: pointer; padding: 10px 12px; font-family: var(--font-heading);
  font-size: 12px; color: var(--color-text); opacity: .5;
}
.lang-toggle button.active { background: var(--color-accent-100); opacity: 1; color: var(--color-accent-700); }
.lang-toggle button:hover { opacity: .85; }

.dx-cell { cursor: pointer; user-select: none; transition: box-shadow .13s ease, transform .13s ease; }
.dx-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dx-press { cursor: pointer; user-select: none; }
.dx-scroll::-webkit-scrollbar { width: 9px; }
.dx-scroll::-webkit-scrollbar-thumb { background: #d5d2ec; border-radius: 999px; }

#app { height: 100vh; display: flex; background: var(--color-bg); color: var(--color-text); position: relative; overflow: hidden; }

.sidebar {
  width: 300px; flex: none; display: flex; flex-direction: column; gap: 22px;
  padding: 26px 24px; background: var(--color-surface);
  border-right: 1px solid var(--color-accent-200); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 999px; background: var(--color-accent);
  display: flex; align-items: center; justify-content: center; color: #fdf5f1;
  font-family: var(--font-heading); font-size: 12px; flex: none;
}
.brand-name { font-family: var(--font-heading); font-size: 22px; letter-spacing: -.01em; }

.pct-row { display: flex; align-items: flex-end; gap: 8px; }
.pct-num { font-family: var(--font-heading); font-size: 52px; line-height: .9; }
.pct-target { font-size: 13px; opacity: .55; padding-bottom: 6px; }

.bar-track { position: relative; height: 12px; border-radius: 999px; background: var(--color-accent-100); overflow: hidden; }
.bar-proj { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--color-accent-300); transition: width .35s ease; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--color-accent); transition: width .35s ease; }
.mark-track { position: relative; height: 10px; }
.mark { position: absolute; top: -2px; width: 2px; height: 10px; border-radius: 1px; background: var(--color-accent-900); opacity: .5; transition: left .25s ease; }
.status-line { font-size: 13.5px; line-height: 1.55; text-wrap: pretty; }

.ledger-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; }
.ledger-dot { width: 13px; height: 13px; flex: none; border-radius: 999px; }
.ledger-label { flex: 1; font-size: 13px; }
.ledger-value { font-family: var(--font-heading); font-size: 15px; }

.hr { height: 1px; background: var(--color-accent-200); }
.section-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }

.target-row { display: flex; align-items: center; gap: 10px; }
.target-copy { flex: 1; font-size: 13px; line-height: 1.4; }
.target-copy small { opacity: .55; font-size: 11.5px; }
.stepper {
  width: 28px; height: 28px; flex: none; border-radius: 999px; border: 1.5px solid var(--color-accent-200);
  display: flex; align-items: center; justify-content: center;
}
.target-val { min-width: 44px; text-align: center; font-family: var(--font-heading); font-size: 17px; transition: color .25s ease, text-shadow .25s ease; }

@keyframes pctHitPulse {
  0% { transform: scale(1); }
  30% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
.pct-num.hit {
  color: var(--color-success) !important;
  text-shadow: 0 0 18px color-mix(in srgb, var(--color-success) 45%, transparent);
  animation: pctHitPulse .5s ease;
}
.target-val.hit {
  color: var(--color-accent-2-700);
  text-shadow: 0 0 10px color-mix(in srgb, var(--color-accent-2) 55%, transparent);
}
.hit-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 999px; margin-left: 6px;
  background: var(--color-accent-2-200); color: var(--color-accent-2-800);
  font-size: 11px; vertical-align: middle;
}

#fireworks-canvas { position: fixed; inset: 0; z-index: 999; pointer-events: none; }

.storage-warn {
  font-size: 11.5px; line-height: 1.5; padding: 8px 10px; border-radius: 12px;
  background: var(--color-accent-2-100); color: var(--color-accent-2-800);
  border: 1px solid var(--color-accent-2-300);
}

.data-io { display: flex; align-items: center; gap: 10px; font-size: 11px; opacity: .4; }
.data-io-btn {
  all: unset; cursor: pointer; font-family: var(--font-body); font-size: 11px;
  color: var(--color-text);
}
.data-io-btn:hover { opacity: .75; text-decoration: underline; }
.data-io-msg { font-size: 10.5px; opacity: .55; }

.history-row { display: flex; align-items: flex-end; gap: 7px; height: 86px; }
.history-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.history-pct { font-size: 10px; opacity: .6; }
.history-bar { width: 100%; border-radius: 8px 8px 3px 3px; }
.history-label { font-size: 10.5px; }

.main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
.toolbar { display: flex; align-items: center; gap: 16px; padding: 18px 32px 12px; }
.nav-btn { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; opacity: .6; }
.nav-btn:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.month-label { font-family: var(--font-heading); font-size: 28px; letter-spacing: -.01em; white-space: nowrap; }
.eligible-line { font-size: 15px; font-weight: 700; opacity: .55; }

.dow-heads { padding: 0 32px 10px; display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
.dow-head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .45; padding-left: 4px; }

.weeks { padding: 0 32px 14px; display: flex; flex-direction: column; gap: 7px; }
.week { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
.cell {
  position: relative; min-height: 64px; border-radius: 18px; padding: 8px 11px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.cell-top { display: flex; align-items: center; gap: 6px; }
.cell-num { font-family: var(--font-heading); font-size: 16px; line-height: 1; }
.cell-today { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.cell-type { font-size: 12px; line-height: 1.25; opacity: .9; }

.legend { padding: 0 32px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; opacity: .72; }
.legend-dot { width: 13px; height: 13px; flex: none; border-radius: 999px; }
.hint { font-size: 13.8px; font-weight: 700; opacity: .5; }

.sheet-overlay { position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(28,18,104,.32); animation: sxFade .16s ease both; }
.sheet {
  position: relative; width: 420px; max-height: 86%; overflow-y: auto; padding: 24px;
  border-radius: 28px; background: var(--color-bg); box-shadow: var(--shadow-lg); animation: sxRise .2s ease both;
}
.sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.sheet-title { font-family: var(--font-heading); font-size: 21px; }
.sheet-sub { font-size: 12.5px; opacity: .6; margin-top: 2px; }
.sheet-close { width: 30px; height: 30px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; opacity: .5; }
.sheet-close:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.sheet-opts { display: flex; flex-direction: column; gap: 7px; }
.sheet-opt { display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 18px; }
.sheet-opt-dot {
  width: 30px; height: 30px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
}
.sheet-opt-label { font-family: var(--font-heading); font-size: 14.5px; }
.sheet-opt-note { font-size: 11.5px; opacity: .6; }
.sheet-opt-check { font-size: 14px; color: var(--color-accent); }
.sheet-shortcut { font-size: 11.5px; opacity: .5; margin-top: 14px; line-height: 1.5; }
</style>
</head>

function holidayName(iso_) {
  return (state.lang === 'en' ? HOLIDAY_NAMES_EN : HOLIDAYS)[iso_];
}

function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
function dow(y, m, d) { return new Date(y, m, d).getDay(); }
function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }

function loadState() {
  let s;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) {}
  if (!s) {
    const now = new Date();
    s = { days: {}, viewY: now.getFullYear(), viewM: now.getMonth(), worktime: 100, lang: 'sv', sheet: null };
  }
  if (s.worktime == null) s.worktime = 100;
  if (s.lang !== 'en' && s.lang !== 'sv') s.lang = 'sv';
  if (!s.celebratedMonths) s.celebratedMonths = [];
  if (!s.seededHolidays) s.seededHolidays = [];
  const seeded = new Set(s.seededHolidays);
  for (const d in HOLIDAYS) {
    if (!(d in s.days) && !seeded.has(d)) {
      s.days[d] = 'holiday';
      seeded.add(d);
    }
  }
  s.seededHolidays = Array.from(seeded);
  return s;
}
let storageOK = true;
function checkStorage() {
  try {
    const k = '__sixty_storage_test__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) { return false; }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ days: state.days, viewY: state.viewY, viewM: state.viewM, worktime: state.worktime, lang: state.lang, seededHolidays: state.seededHolidays, celebratedMonths: state.celebratedMonths }));
    storageOK = true;
  } catch (e) { storageOK = false; }
}

storageOK = checkStorage();
let state = loadState();
const TODAY = todayIso();
function monthKey(y, m) { return y + '-' + m; }

function setState(patch) {
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  saveState();
  render();
}

function setDay(iso_, type) {
  const days = Object.assign({}, state.days);
  if (type === null) delete days[iso_]; else days[iso_] = type;
  setState({ days, sheet: null });
}

let ioMsg = '';
function exportData() {
  const payload = {
    days: state.days, viewY: state.viewY, viewM: state.viewM,
    worktime: state.worktime, lang: state.lang, seededHolidays: state.seededHolidays,
    celebratedMonths: state.celebratedMonths,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sixty-data-' + todayIso() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object' || typeof data.days !== 'object') throw new Error('invalid');
      state.days = data.days || {};
      state.viewY = typeof data.viewY === 'number' ? data.viewY : state.viewY;
      state.viewM = typeof data.viewM === 'number' ? data.viewM : state.viewM;
      state.worktime = typeof data.worktime === 'number' ? data.worktime : 100;
      state.lang = (data.lang === 'en' || data.lang === 'sv') ? data.lang : state.lang;
      state.seededHolidays = Array.isArray(data.seededHolidays) ? data.seededHolidays : [];
      state.celebratedMonths = Array.isArray(data.celebratedMonths) ? data.celebratedMonths : [];
      saveState();
      ioMsg = STR.importOk;
    } catch (e) {
      ioMsg = STR.importErr;
    }
    render();
  };
  reader.onerror = () => { ioMsg = STR.importErr; render(); };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm(STR.clearConfirm)) return;
  const now = new Date();
  state.days = {};
  const seeded = new Set();
  for (const d in HOLIDAYS) { state.days[d] = 'holiday'; seeded.add(d); }
  state.seededHolidays = Array.from(seeded);
  state.celebratedMonths = [];
  state.worktime = 100;
  state.viewY = now.getFullYear();
  state.viewM = now.getMonth();
  state.sheet = null;
  saveState();
  ioMsg = STR.clearOk;
  render();
}

function stats(y, m) {
  const s = state, d = dim(y, m);
  let working = 0, office = 0, travel = 0, home = 0, out = 0, ahead = 0;
  for (let dd = 1; dd <= d; dd++) {
    if (WORKDAYS.indexOf(dow(y, m, dd)) === -1) continue;
    working++;
    const t = s.days[iso(y, m, dd)];
    if (t === 'office') office++;
    else if (t === 'travel') travel++;
    else if (t === 'home') home++;
    else if (EXCLUDED.indexOf(t) !== -1) out++;
    else if (iso(y, m, dd) >= TODAY) ahead++;
  }
  const inOffice = office + travel;
  const eligibleFull = Math.max(1, working - out);
  const scale = s.worktime / 100;
  const eligible = Math.max(1, Math.round(eligibleFull * scale));
  const aheadScaled = Math.round(ahead * scale);
  const required = Math.floor(eligible * TARGET / 100);
  return {
    working, inOffice, home, out, ahead: aheadScaled, eligible, eligibleFull, required,
    pct: Math.round(inOffice / eligible * 100),
    deficit: Math.max(0, required - inOffice),
    projPct: Math.round(Math.min(inOffice + aheadScaled, eligible) / eligible * 100),
  };
}

function look(t) {
  switch (t) {
    case 'office': return { bg: 'var(--color-accent)', fg: '#fdf5f1', border: '1px solid transparent', label: STR.types.office, glyph: 'O' };
    case 'travel': return { bg: 'var(--color-accent-600)', fg: '#fdf5f1', border: '1px solid transparent', label: STR.types.travel, glyph: STR.badges.travel };
    case 'home': return { bg: 'var(--color-accent-2-200)', fg: 'var(--color-accent-2-800)', border: '1px solid transparent', label: STR.types.home, glyph: 'H' };
    case 'leave': return { bg: 'var(--color-neutral-200)', fg: 'var(--color-neutral-700)', border: '1px solid transparent', label: STR.types.leave, glyph: STR.badges.leave };
    case 'sick': return { bg: 'var(--color-neutral-100)', fg: 'var(--color-neutral-700)', border: '1.5px dashed var(--color-neutral-400)', label: STR.types.sick, glyph: STR.badges.sick };
    case 'holiday': return { bg: 'var(--color-accent-2-100)', fg: 'var(--color-accent-2-700)', border: '1px solid transparent', label: STR.types.holiday, glyph: STR.badges.holiday };
    default: return { bg: 'var(--color-surface)', fg: 'var(--color-accent-700)', border: '1.5px dashed var(--color-accent-200)', label: '', glyph: '×' };
  }
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'style') e.style.cssText = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) e.appendChild(c); });
  return e;
}

function render() {
  const s = state;
  STR = s.lang === 'en' ? STR_EN : STR_SV;
  const view = stats(s.viewY, s.viewM);
  const now = new Date();
  const isCurrent = s.viewY === now.getFullYear() && s.viewM === now.getMonth();
  const fmtPct = n => n + STR.pct;
  const hit = view.deficit === 0;
  const mKey = monthKey(s.viewY, s.viewM);
  if (hit && state.celebratedMonths.indexOf(mKey) === -1) {
    state.celebratedMonths = state.celebratedMonths.concat([mKey]);
    saveState();
    launchFireworks();
  }

  const app = document.getElementById('app');
  app.innerHTML = '';
  const root = el('div', { class: 'app-inner', style: 'height:100%;display:flex;width:100%' });

  const daysBarPct = Math.min(100, expectedPct);

  targetBlock.appendChild(targetRow);

  const worktimeRow = el('div', { class: 'target-row' });
  const worktimeCopy = el('div', { class: 'target-copy' });
  worktimeCopy.appendChild(document.createTextNode(STR.worktime));
  worktimeCopy.appendChild(el('br'));
  worktimeCopy.appendChild(el('small', { text: STR.worktimeNote(s.worktime, view.eligible, STR.months[s.viewM]) }));

  yearBlock.appendChild(el('div', { class: 'section-title', text: STR.year }));
  const histRow = el('div', { class: 'history-row' });
  const histMonths = [];
  for (let i = 4; i >= 0; i--) {
    let mm = s.viewM - i, yy = s.viewY;
    while (mm < 0) { mm += 12; yy--; }
    histMonths.push([yy, mm]);
  }
  histMonths.forEach(([yy, mm]) => {
    const st = stats(yy, mm);
    const active = mm === s.viewM && yy === s.viewY;
    histRow.appendChild(el('div', { class: 'history-col dx-press', onclick: () => setState({ viewM: mm, viewY: yy }) }, [
      el('div', { class: 'history-pct', text: st.pct + STR.pct }),
      el('div', { class: 'history-bar', style: 'height:' + Math.max(4, Math.round(Math.min(100, st.pct) / 100 * 56)) + 'px;background:' + (active ? 'var(--color-accent-300)' : (st.deficit === 0 ? 'var(--color-accent)' : 'var(--color-neutral-400)')) }),
      el('div', { class: 'history-label', style: 'opacity:' + (active ? '1' : '0.5'), text: STR.monShort[mm] }),
    ]));

  yearBlock.appendChild(histRow);

  const fileInput = el('input', {

  root.appendChild(sidebar);

  // ---------- Main ----------
  const main = el('div', { class: 'main dx-scroll' });

  const toolbar = el('div', { class: 'toolbar' });
  const navGroup = el('div', { style: 'display:flex;align-items:center;gap:4px' });
  navGroup.appendChild(el('div', { class: 'nav-btn dx-press', onclick: () => setState(p => p.viewM === 0 ? { viewM: 11, viewY: p.viewY - 1 } : { viewM: p.viewM - 1 }) }, [svgChevronLeft()]));
  navGroup.appendChild(el('div', { class: 'nav-btn dx-press', onclick: () => setState(p => p.viewM === 11 ? { viewM: 0, viewY: p.viewY + 1 } : { viewM: p.viewM + 1 }) }, [svgChevronRight()]));
  toolbar.appendChild(navGroup);
  toolbar.appendChild(el('div', { class: 'month-label', text: cap(STR.months[s.viewM]) + ' ' + s.viewY }));
  toolbar.appendChild(el('div', { class: 'eligible-line', text: STR.eligibleLine(view.working, view.eligible, view.required) }));
  toolbar.appendChild(el('div', { style: 'flex:1' }));
  toolbar.appendChild(el('div', { class: 'lang-toggle' }, [
    el('button', { class: s.lang === 'sv' ? 'active' : '', text: 'SV', onclick: () => setState({ lang: 'sv' }) }),
    el('button', { class: s.lang === 'en' ? 'active' : '', text: 'EN', onclick: () => setState({ lang: 'en' }) }),
  ]));
  toolbar.appendChild(el('button', { class: 'btn btn-secondary dx-press', text: STR.today, onclick: () => setState({ viewY: now.getFullYear(), viewM: now.getMonth() }) }));
  toolbar.appendChild(el('button', { class: 'btn btn-primary dx-press', text: STR.officeToday, onclick: () => setDay(TODAY, 'office') }));
  main.appendChild(toolbar);

  const dowHeads = el('div', { class: 'dow-heads' }, STR.dows.map(h => el('div', { class: 'dow-head', text: h })));
  main.appendChild(dowHeads);

  const first = dow(s.viewY, s.viewM, 1);
  const lead = (first + 6) % 7;
  const d = dim(s.viewY, s.viewM);
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let dd = 1; dd <= d; dd++) cells.push(dd);
  while (cells.length % 7 !== 0) cells.push(null);

  const weeksEl = el('div', { class: 'weeks' });
  for (let i = 0; i < cells.length; i += 7) {
    const weekEl = el('div', { class: 'week' });
    cells.slice(i, i + 7).forEach(dd => {
      if (dd === null) { weekEl.appendChild(el('div', { style: 'min-height:64px;opacity:0' })); return; }
      const iso_ = iso(s.viewY, s.viewM, dd);
      const w = dow(s.viewY, s.viewM, dd);
      const work = WORKDAYS.indexOf(w) !== -1;
      const t = s.days[iso_];
      const K = look(work ? t : undefined);
      const isToday = iso_ === TODAY;
      const cell = el('div', {
        class: work ? 'cell dx-cell' : 'cell',
        style: 'background:' + (work ? K.bg : 'transparent') + ';color:' + (work ? K.fg : 'color-mix(in srgb, #1c1268 30%, transparent)') + ';border:' + (work ? K.border : '1px solid transparent') + ';box-shadow:' + (isToday ? '0 0 0 2.5px var(--color-accent-400)' : 'none') + ';opacity:' + (work ? '1' : '0.6') + ';cursor:' + (work ? 'pointer' : 'default'),
        title: holidayName(iso_) || '',
      }, [
        el('div', { class: 'cell-top' }, [
          el('span', { class: 'cell-num', text: dd }),
          el('span', { class: 'cell-today', text: isToday ? STR.today : '' }),
        ]),
        el('div', { class: 'cell-type', text: work ? K.label : '' }),
      ]);
      if (work) {
        cell.addEventListener('click', () => {
          const cur = s.days[iso_];
          setDay(iso_, cur === 'office' ? 'home' : cur === 'home' ? null : 'office');
        });
        cell.addEventListener('contextmenu', (e) => { e.preventDefault(); setState({ sheet: iso_ }); });
      }
      weekEl.appendChild(cell);
    });
    weeksEl.appendChild(weekEl);
  }
  main.appendChild(weeksEl);

  const legendEl = el('div', { class: 'legend' });
  ['office', 'travel', 'home', 'leave', 'sick', 'holiday'].forEach(t => {
    const K = look(t);
    legendEl.appendChild(el('div', { class: 'legend-item' }, [
      el('div', { class: 'legend-dot', style: 'background:' + K.bg + ';border:' + K.border }),
      el('span', { text: K.label }),
    ]));
  });
  main.appendChild(legendEl);
  main.appendChild(el('div', { class: 'hint', style: 'padding:0 32px 20px', text: STR.hint }));

  root.appendChild(main);

  // ---------- Sheet ----------
  if (s.sheet) {
    const sheetIso = s.sheet;
    const p = sheetIso.split('-').map(Number);
    const dt = new Date(p[0], p[1] - 1, p[2]);
    const sheetTitle = STR.dowFull[dt.getDay()] + ' ' + p[2] + ' ' + STR.months[p[1] - 1];
    const sheetSub = (holidayName(sheetIso) ? holidayName(sheetIso) + ' · ' : '') + (sheetIso === TODAY ? STR.subToday : (sheetIso < TODAY ? STR.subPast : STR.subFuture));
    const curT = s.days[sheetIso] || null;

    const overlay = el('div', { class: 'sheet-overlay' });
    overlay.appendChild(el('div', { class: 'sheet-backdrop', onclick: () => setState({ sheet: null }) }));
    const sheet = el('div', { class: 'sheet' });
    const head = el('div', { class: 'sheet-head' }, [
      el('div', { style: 'flex:1' }, [
        el('div', { class: 'sheet-title', text: sheetTitle }),
        el('div', { class: 'sheet-sub', text: sheetSub }),
      ]),
      el('div', { class: 'sheet-close dx-press', onclick: () => setState({ sheet: null }) }, [svgClose()]),
    ]);
    sheet.appendChild(head);

    const opts = el('div', { class: 'sheet-opts' });
    STR.opts.forEach(([t, label, note]) => {
      const K = look(t);
      const sel = curT === t;
      opts.appendChild(el('div', {
        class: 'sheet-opt dx-press',
        style: 'background:' + (sel ? 'var(--color-accent-100)' : 'var(--color-surface)') + ';border:' + (sel ? '1.5px solid var(--color-accent)' : '1.5px solid transparent'),
        onclick: () => setDay(sheetIso, t),
      }, [
        el('div', { class: 'sheet-opt-dot', style: 'background:' + (t ? K.bg : 'transparent') + ';color:' + (t ? K.fg : 'color-mix(in srgb, #1c1268 45%, transparent)') + ';border:' + (t ? K.border : '1.5px dashed var(--color-accent-200)'), text: K.glyph }),
        el('div', { style: 'flex:1' }, [
          el('div', { class: 'sheet-opt-label', text: label }),
          el('div', { class: 'sheet-opt-note', text: note }),
        ]),
        el('div', { class: 'sheet-opt-check', style: 'opacity:' + (sel ? '1' : '0'), text: '✓' }),
      ]));
    });
    sheet.appendChild(opts);
    sheet.appendChild(el('div', { class: 'sheet-shortcut', text: STR.shortcut }));
    overlay.appendChild(sheet);
    root.appendChild(overlay);
  }

  app.appendChild(root);
}

function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

function svgMinus() {
  const s = svgBase();
  s.innerHTML = '<path d="M5 12h14"></path>';
  return s;
}
function svgPlus() {
  const s = svgBase();
  s.innerHTML = '<path d="M12 5v14M5 12h14"></path>';
  return s;
}
function svgChevronLeft() {
  const s = svgBase(17);
  s.innerHTML = '<path d="M15 18l-6-6 6-6"></path>';
  return s;
}
function svgChevronRight() {
  const s = svgBase(17);
  s.innerHTML = '<path d="M9 18l6-6-6-6"></path>';
  return s;
}
function svgClose() {
  const s = svgBase(15);
  s.innerHTML = '<path d="M6 6l12 12M18 6L6 18"></path>';
  return s;
}
function svgBase(size) {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', size || 13);
  s.setAttribute('height', size || 13);
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2.75');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  return s;
}

function launchFireworks() {
  const old = document.getElementById('fireworks-canvas');
  if (old) old.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'fireworks-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#1c1268', '#7369b8', '#d08b7d', '#f0c8bf', '#fdf5f1', '#372c93'];
  const gravity = 0.045;
  const friction = 0.985;
  let particles = [];

  function burst(x, y) {
    const count = 46;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const speed = 2.4 + Math.random() * 3.4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: colors[(Math.random() * colors.length) | 0],
        life: 1,
        decay: 0.007 + Math.random() * 0.011,
        size: 2 + Math.random() * 2.2,
      });
    }
  }

  const bursts = [
    [0.28, 0.32], [0.72, 0.26], [0.5, 0.42], [0.62, 0.55], [0.38, 0.5],
  ];
  bursts.forEach(([fx, fy], i) => {
    setTimeout(() => burst(canvas.width * fx, canvas.height * fy), i * 450);
  });

  const start = performance.now();
  const duration = bursts.length * 450 + 2200;

  function frame(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.vy += gravity;
      p.vx *= friction;
      p.vy *= friction;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (now - start < duration || particles.length) {
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

render();
</script>
